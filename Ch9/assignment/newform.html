<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Form</title>
</head>
<body>

<form action="https://webdevbasics.net/scripts/demo.php" method="post">

    <!-- Username -->
    <label for="username">Username:</label>
    <input type="text" name="username" id="username" maxlength="30">
    <br><br>

    <!-- Password -->
    <label for="pword">Password:</label>
    <input type="password" name="pword" id="pword">
    <br><br>

    <!-- Favorite Day (Radio Buttons) -->
    <p>Favorite Day of the Week:</p>
    <input type="radio" name="favday" value="Monday"> Monday<br>
    <input type="radio" name="favday" value="Tuesday"> Tuesday<br>
    <input type="radio" name="favday" value="Wednesday"> Wednesday<br>
    <input type="radio" name="favday" value="Thursday"> Thursday<br>
    <input type="radio" name="favday" value="Friday"> Friday<br>
    <input type="radio" name="favday" value="Saturday"> Saturday<br>
    <input type="radio" name="favday" value="Sunday"> Sunday<br><br>

    <!-- Favorite Social Network -->
    <label for="social">Favorite Social Networking Site:</label>
    <select name="social" id="social">
        <option value="facebook">Facebook</option>
        <option value="instagram">Instagram</option>
        <option value="twitter">Twitter</option>
        <option value="tiktok">TikTok</option>
        <option value="snapchat">Snapchat</option>
    </select>
    <br><br>

    <!-- Shipping Address -->
    <fieldset>
        <legend>Shipping Address</legend>

        <label for="address1">Address Line 1:</label>
        <input type="text" name="address1" id="address1"><br><br>

        <label for="address2">Address Line 2:</label>
        <input type="text" name="address2" id="address2"><br><br>

        <label for="city">City:</label>
        <input type="text" name="city" id="city"><br><br>

        <label for="state">State:</label>
        <input type="text" name="state" id="state"><br><br>

        <label for="zip">Zip:</label>
        <input type="text" name="zip" id="zip"><br><br>

    </fieldset>
    <br>

    <!-- Hidden Input -->
    <input type="hidden" name="userid" value="12345">

    <!-- Image Submit Button -->
    <input type="image" src="signup.gif" alt="Sign Up">

</form>

</body>
</html>
