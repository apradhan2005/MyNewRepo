<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centered Heading</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        position: relative;
        width: 100%;
        height: 500px; /* adjust if needed */
        background-image: url("lake.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .container h1 {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 40px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Centered Heading</h1>
</div>

</body>
</html>
