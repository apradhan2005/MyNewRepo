<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two Column Layout</title>

<style>
/* BODY */
body {
    background-color: #000066;
}

/* WRAPPER */
#wrapper {
    width: 80%;
    margin-left: auto;
    margin-right: auto;
    background-color: #EAEAEA;
}

/* HEADER */
header {
    background-color: #CCCCFF;
}

/* H1 */
h1 {
    margin: 0;
    padding: 10px;
}

/* NAV */
nav {
    float: left;
    width: 90px;
    padding: 10px;
}

/* MAIN */
main {
    margin-left: 100px;
    padding: 10px;
    background-color: #FFFFFF;
    display: block; /* helps Internet Explorer */
}

/* FOOTER */
footer {
    text-align: center;
    font-style: italic;
    background-color: #CCCCFF;
    clear: both;
    padding: 10px;
}
</style>

</head>

<body>

<div id="wrapper">

<header>
    <h1>My Web Page</h1>
</header>

<nav>
    <a href="#">Home</a><br>
    <a href="#">Services</a><br>
    <a href="#">Contact</a>
</nav>

<main>
    <p>This is the main content area. It appears in the right column.</p>
    <p>The navigation appears in the left column.</p>
</main>

<footer>
    Copyright © 2026
</footer>

</div>

</body>
</html>
